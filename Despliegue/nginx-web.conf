# Nginx DENTRO del contenedor del front de Análisis Comercial: sirve el SPA y manda /api/ a la API.
# El TLS, el freno al login y /plataforma/ (login central) los resuelve el Nginx del host
# (nginx-host-analistascomercial.conf). Copiado del CashFlow; cambia la API y el mapa.

# Solo lo propio, más las fuentes de Google (index.html) y los mosaicos de OpenStreetMap (la vista de mapa). Los
# style={{}} de React y los de Leaflet no la necesitan: van por el DOM, no como atributo. data: y blob: para imágenes.
map "" $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

map $http_x_forwarded_proto $proto_final {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # /assets → /assets/ relativo: si no, apunta a http y al 8080 interno

    # El DNS de Docker se vuelve a consultar cada 10 s (al recrear la API cambia de IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    location ~ \.map$ {
        return 404;
    }

    # Los archivos de Vite llevan hash en el nombre: se pueden guardar para siempre. index.html nunca.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";   # sin always: un 404 no se guarda
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;   # SPA (React Router)
    }

    location /api/ {
        set $api api:8080;
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;   # la IP del cliente, sin sumar la de este contenedor
        proxy_set_header X-Forwarded-Proto $proto_final;
        proxy_read_timeout 60s;
    }
}
