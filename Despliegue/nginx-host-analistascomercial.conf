# Server block para el Nginx del HOST: Análisis Comercial (su propia pantalla y sesión del login central).
#
#   cp nginx-host-analistascomercial.conf /etc/nginx/sites-available/vignoli-analistascomercial.conf
#   ln -s /etc/nginx/sites-available/vignoli-analistascomercial.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx --redirect -d analistascomercial.vignoliyasconsultoria.com     (necesita el registro DNS A)
#
#   El nombre en el VPS empieza con «vignoli-» a propósito: ningún sitio es default_server, así que Nginx manda los
#   nombres que no conoce (y los pedidos a la IP pelada) al primero en orden alfabético, que es julietteadmin.
#   «analistascomercial.conf» le ganaría y se quedaría con todo eso.
#
#   /plataforma/... → portal de la plataforma (127.0.0.1:8090), que lo pasa a su API: el login con
#                     ?aplicacion=analisis-comercial deja la cookie en ESTE dominio, sin CORS.
#   todo lo demás  → contenedor analisis-prod-web (127.0.0.1:8098): el SPA y /api/.

# Freno por IP al login (zona propia de este archivo; los otros sitios tienen la suya).
limit_req_zone $binary_remote_addr zone=analisis_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name analistascomercial.vignoliyasconsultoria.com;

    client_max_body_size 1m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sin importar mayúsculas ni la barra final (ASP.NET atiende las dos formas igual).
    location ~* ^/plataforma/api/auth/login/?$ {
        limit_req zone=analisis_login burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # pisa lo que mande el cliente: no se puede falsificar
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /plataforma/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
